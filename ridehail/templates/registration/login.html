{% extends "base.html" %}
{% block content %}
<div class="max-w-sm mx-auto bg-white rounded-lg shadow p-6">
  <h1 class="text-2xl font-bold mb-4">Log in</h1>
  <form method="post">{% csrf_token %}
    <input name="username" placeholder="Username" class="block w-full border rounded px-3 py-2 mb-3" required>
    <input name="password" type="password" placeholder="Password" class="block w-full border rounded px-3 py-2 mb-3" required>
    {% if form.errors %}<p class="text-sm text-red-600 mb-3">Wrong username or password.</p>{% endif %}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="w-full bg-black text-white py-2 rounded">Log in</button>
  </form>
</div>
{% endblock %}
