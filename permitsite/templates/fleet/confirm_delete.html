{% extends "base.html" %}{% block content %}
<div class="max-w-md bg-white rounded shadow p-6">
  <h1 class="text-xl font-bold mb-3">Delete {{ vehicle.fleet_number }}?</h1>

    <a href="/fleet/" class="underline ml-2">Cancel</a>
  </form>
</div>
{% endblock %}
