{% extends "base.html" %}{% block title %}Log in{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white rounded shadow p-6">
  <h1 class="text-2xl font-bold mb-4">Log in</h1>
  <form method="post" class="space-y-3">{% csrf_token %}
    {{ form.as_p }}
    <button class="bg-slate-900 text-white px-4 py-2 rounded">Log in</button>
  </form>
  <p class="mt-4 text-sm">New client? <a class="underline" href="/accounts/signup/">Create an account</a></p>
</div>
{% endblock %}
